services:
  postgres:
    image: postgres:17.11
    container_name: job-tracker-e2e-postgres
    environment:
      POSTGRES_DB: jobtracker
      POSTGRES_USER: jobtracker
      POSTGRES_PASSWORD: jobtracker_local
    ports:
      - "5432:5432"
    volumes:
      - postgres-e2e-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobtracker -d jobtracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2.16
    container_name: job-tracker-e2e-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.31.2
    container_name: job-tracker-e2e-mailpit
    ports:
      - "8025:8025"   
      - "1025:1025"   
    environment:
      MP_MAX_MESSAGES: "100"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-e2e-data:
